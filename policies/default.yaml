name: default
budgets:
  maxImplementationIterations: 4
  maxReviewCycles: 2
  maxPlanRevisions: 1
  maxToolCalls: 150
actions:
  repository.read: allow
  repository.write: allow
  test.run: allow
  review.run: allow
  dependency.install: approve
  migration.create: allow_with_warning
  git.commit: approve
  git.push: approve
  deploy: deny
  production.shell: deny
  jira.read: allow
  jira.comment: approve
  jira.transition: approve
  jira.close: deny
commands:
  allow:
    - '^(npm|pnpm|yarn|bun) (--version|test|lint|check|typecheck|build|run (test|lint|check|typecheck|build|format(:check)?)([:A-Za-z0-9._-]*)?)( |$)'
    - '^composer (--version|test|lint|check|analyse|analyze|phpstan|phpunit)( |$)'
    - '^php (-v|--version|-l [A-Za-z0-9._/-]+|artisan (test|about))( |$)'
    - '^python3? (-V|--version|-m (pytest|unittest|compileall))( |$)'
    - '^pytest( |$)'
    - '^cargo (test|check|clippy|build)( |$)'
    - '^go (test|vet|build)( |$)'
    - '^dotnet (test|build)( |$)'
    - '^(mvn|mvnw|./mvnw) (test|verify)( |$)'
    - '^(gradle|./gradlew) (test|check|build)( |$)'
    - '^vendor/bin/(phpunit|phpstan|psalm|phpcs)( |$)'
    - '^git (diff --check|status --short)( |$)'
