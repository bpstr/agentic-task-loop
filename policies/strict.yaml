name: strict
budgets:
  maxImplementationIterations: 2
  maxReviewCycles: 1
  maxPlanRevisions: 1
  maxToolCalls: 75
actions:
  repository.read: allow
  repository.write: approve
  test.run: allow
  review.run: allow
  dependency.install: deny
  migration.create: approve
  git.commit: deny
  git.push: deny
  deploy: deny
  production.shell: deny
  jira.read: allow
  jira.comment: deny
  jira.transition: deny
  jira.close: deny
commands:
  allow:
    - '^(npm|pnpm|yarn|bun) (--version|test|lint|check|typecheck|run (test|lint|check|typecheck|format(:check)?)([:A-Za-z0-9._-]*)?)( |$)'
    - '^composer (--version|test|lint|check|analyse|analyze|phpstan|phpunit)( |$)'
    - '^php (-v|--version|-l [A-Za-z0-9._/-]+|artisan (test|about))( |$)'
    - '^python3? (-V|--version|-m (pytest|unittest|compileall))( |$)'
    - '^pytest( |$)'
    - '^cargo (test|check|clippy)( |$)'
    - '^go (test|vet)( |$)'
    - '^dotnet test( |$)'
    - '^(mvn|mvnw|./mvnw) (test|verify)( |$)'
    - '^(gradle|./gradlew) (test|check)( |$)'
    - '^vendor/bin/(phpunit|phpstan|psalm|phpcs)( |$)'
    - '^git (diff --check|status --short)( |$)'
